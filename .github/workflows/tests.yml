name: R and Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("tibble", "jsonlite", "testthat", "readxl", "pkgload"))'
      - name: Install and test the R package
        run: |
          R CMD INSTALL R
          Rscript -e 'testthat::test_local("R")'
      - name: Install Python package
        run: python -m pip install './Python[test,excel]'
      - name: Test Python and compare with R
        run: python -m pytest Python/tests -q
