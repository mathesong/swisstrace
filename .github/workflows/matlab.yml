name: MATLAB tests and R parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  matlab:
    name: MATLAB R2024b (Linux) and R parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Generate expected results from R
        run: |
          Rscript -e 'install.packages(c("tibble", "jsonlite"))'
          Rscript MATLAB/tests/generate_r_reference.R
      - uses: matlab-actions/setup-matlab@v3
        with:
          # The documented supported/tested release; broaden only after CI validation.
          release: R2024b
      - name: Run MATLAB tests including R comparisons
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('MATLAB'); results = runtests('MATLAB/tests'); assertSuccess(results)
